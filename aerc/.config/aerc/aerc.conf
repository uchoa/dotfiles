# aerc.conf template
# Basic UI and generic settings for aerc
[ui]
index-columns = date<20,name<20,flags>4,subject<*
threading-enabled = true
styleset-name = nord
# Add more aerc UI/binding configurations as needed.

[filters]
text/plain=colorize
text/html=html | colorize
subject,~^\[PATCH=awk -f colorize_patch
message/delivery-status=colorize
message/rfc822=colorize
application/pdf=pdftotext - - | colorize

[viewer]
parse-http-links=true

[openers]
text/html=/home/uchoa/.local/bin/surf-email {}

[compose]
address-book-cmd=/home/uchoa/.config/aerc/test-address.sh "%s"

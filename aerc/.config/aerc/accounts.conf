# Template for an IMAP account via mbsync
[personal]
source            = maildir://~/.local/share/mail/personal
outgoing          = env MSMTP=/home/uchoa/.local/bin/msmtp-wrapper.py msmtpq --read-envelope-from --read-recipients
default           = INBOX
from              = André Uchôa <uchoa@pobox.com>
copy-to           = Sent
postpone          = Drafts

# Template for a Gmail account via lieer + notmuch
[scienti]
source            = notmuch://
outgoing          = env MSMTP=/home/uchoa/.local/bin/msmtp-wrapper.py msmtpq --read-envelope-from --read-recipients
default           = INBOX
from              = André Uchôa <uchoa@scienti.com.br>
copy-to           = Sent
postpone          = Drafts
# Virtual folders via notmuch queries
query-map         = ~/.config/aerc/scienti-queries.map
maildir-account-path = scienti
